name: Test

on:
  workflow_dispatch:
  push:
      # TODO: Delete the push event once this is on main
  workflow_run:
    workflows: [Sort Tests]
    types:
      - completed

jobs:
  jvm:
    name: Test JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: coursier/cache-action@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"
      - name: Test
        run: ./mill jvm.test

  js:
    name: Compile JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: coursier/cache-action@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"
      - name: Compile (as if it were being deployed to GH pages)
        run: |
          ./mill js.fullLinkJS
          ./mill jvm.theseus
